name: Feature request
description: Propose an explainable metric or workflow improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Which teacher, learner, researcher, or tool-builder workflow needs this?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Explainable evidence
      description: What observable evidence should the feature use, and how can a human verify it?
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Privacy and security considerations
      description: Could this expose learner data, add network access, execute code, or introduce a dependency?
    validations:
      required: true

