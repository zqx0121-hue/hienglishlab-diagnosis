name: Bug report
description: Report reproducible incorrect or unsafe behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include real learner data, credentials, or other personal information. Use a synthetic minimal example."
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal synthetic input and the command used.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and Python version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm that this report contains no identifiable learner data or secrets.
          required: true

