[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hienglishlab-diagnosis"
version = "0.1.0"
description = "A privacy-first, explainable CLI for analyzing English-learning evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zqx0121-hue" }]
keywords = ["education", "english-learning", "assessment", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
hienglish-diagnose = "hienglishlab_diagnosis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

